name = "hoangmathlib"
defaultTargets = ["HoangMathLib", "HoangMathLibStaging"]
lintDriver = "batteries/runLinter"
keywords = ["mathematics", "graph-theory", "combinatorics", "reconfiguration"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.warn.sorry = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.2"

[[lean_lib]]
name = "HoangMathLib"

# Staging-only build target: exactly the modules under HoangMathLib/Mathlib/.
# Used by mathlib-master-probe.yml to test the staging subtree against mathlib
# master without main ever leaving the stable pin.
[[lean_lib]]
name = "HoangMathLibStaging"
globs = ["HoangMathLib.Mathlib.+"]
